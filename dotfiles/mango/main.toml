[var]
term = "kitty"
browser = "librewolf"

# #000000FF
color_black = "0x000000FF"
# #C0C0C0FF
color_gray = "0xC0C0C0FF"
# #F9F9FAFF
color_white = "0xF9F9FAFF"
# #008080FF
color_primary = "0x008080FF"
# #2222A9FF
color_secondary = "0x2222A9FF"
# #2222A922
color_secondary_transparent = "0x2222A922"

[global]
exec_once = ["~/.config/mango/autostart"]

enable_hotarea = 0  # disable overview
cursor_hide_timeout = 5
cursor_hide_on_keypress = 1
view_current_to_back = 0
drag_tile_small = 1
disable_middle_paste = 1
smart_gaps = 0

# scratchpad
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.8
scratchpad_cross_monitor = 1  # monitors have the same scratchpad
float_full_to_top = 1  # one layer for all, permits the scratchpad to be visible above fullscreen

# input
repeat_rate = 25
repeat_delay = 300
mouse_middle_button_emulation = 1  # enable middle button on trackpad
trackpad_natural_scrolling = 1

# master-stack
new_is_master = 1
default_master_factor = 0.5
center_master_overspread = 1

# scroller
scroller_default_proportion = 0.5
scroller_prefer_overspread = 1
scroller_focus_center = 0
scroller_prefer_center = 1
scroller_ignore_proportion_single = 0
scroller_default_proportion_single = 1.0
edge_scroller_pointer_focus = 0

# aprearence
gap_inner_horizontal = 4
gap_inner_vertical = 4
gap_outer_horizontal = 8
gap_outer_vertical = 8
scroller_structs = 8
border_px = 2

dim_enable = 1
dim_focused_color = 0x00000000
dim_unfocused_color = 0x00000022

root_color = "$color_black"
border_color = "$color_black"
drop_color = "$color_secondary_transparent"
focus_color = "$color_gray"
urgent_color = "$color_gray"
scratchpad_color = "$color_gray"

jump_label_decorate_fg_color = "$color_black"
jump_label_decorate_bg_color = "$color_primary"
jump_label_decorate_border_color = "$color_gray"
jump_label_decorate_border_width = 2
jump_label_decorate_corner_radius = 0
jump_label_decorate_font_desc = "Tiny5 Bold"

special_dim = 0.2
special_gap_inner_horizontal = 4
special_gap_inner_vertical = 4
special_gap_outer_horizontal = 32
special_gap_outer_vertical = 32

# animations
animations = 1
tag_animation_direction = 0  # vertical animation tags

animation_fade_in = 0
animation_fade_out = 1
animation_type_open = "slide"
animation_type_close = "fade"

layer_animations = 1
layer_animation_type_open = "slide"
layer_animation_type_close = "slide"

animation_duration_move = 350
animation_duration_open = 350
animation_duration_tag = 500
animation_duration_close = 200
animation_duration_focus = 600

animation_curve_move = [0.16, 1, 0.3, 1]
animation_curve_open = [0.16, 1, 0.3, 1]
animation_curve_close = [0.16, 1, 0.3, 1]
animation_curve_focus = [0.16, 1, 0.3, 1]
animation_curve_tag = [0.34, 1.30, 0.64, 1]

[[rule.window_rule]]
title = "filechooser"
is_named_scratchpad = 1
width = 0.8
height = 0.8

[[rule.window_rule]]
app_id = "dev.aunetx.deezer"
is_named_scratchpad = 1
width = 0.8
height = 0.8

[[rule.layer_rule]]
layer_name = "wofi"
no_animation = 1

[[rule.layer_rule]]
layer_name = "selection"  # slurp
no_animation = 1

[[rule.tag_rule]]
id = 0
layout_name = "scroller"

[bind.default]
# misc
"SUPER+SHIFT+r" = "reload_config"
"SUPER+f" = "togglefullscreen"
"SUPER+SHIFT+f" = "togglefakefullscreen"
"SUPER+Space" = "togglefloating"
"SUPER+SHIFT+q" = "killclient"

# utilities
"SUPER+w" = "spawn,$NIXOS_CONFIG_DIR/dotfiles/scripts/bar_controls toggle"

"XF86MonBrightnessUp" = "spawn,brightnessctl set +5%"
"XF86MonBrightnessDown" = "spawn,brightnessctl set 5%-"
"XF86AudioMute" = "spawn,$NIXOS_CONFIG_DIR/dotfiles/scripts/volume mute"
"XF86AudioLowerVolume" = "spawn,$NIXOS_CONFIG_DIR/dotfiles/scripts/volume down"
"XF86AudioRaiseVolume" = "spawn,$NIXOS_CONFIG_DIR/dotfiles/scripts/volume up"
"XF86AudioMicMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"

"SUPER+s" = "spawn,$XDG_CONFIG_HOME/scripts/screenshoot"
"SUPER+y" = "spawn,$XDG_CONFIG_HOME/scripts/screenshoot copy"
"SUPER+c" = "spawn,$XDG_CONFIG_HOME/scripts/screenshoot color"

# apps
"SUPER+Return" = "spawn,$term --hold $NIXOS_CONFIG_DIR/dotfiles/scripts/run_cmd fastfetch"
"SUPER+b" = "spawn,$browser"
"SUPER+d" = "spawn,wofi"

"SUPER+m" = "toggle_named_scratchpad,dev.aunetx.deezer,none,deezer-desktop"

# move window
"SUPER+SHIFT+h" = "exchange_client,left"
"SUPER+SHIFT+j" = "exchange_client,down"
"SUPER+SHIFT+k" = "exchange_client,up"
"SUPER+SHIFT+l" = "exchange_client,right"

"SUPER+SHIFT+n" = "exchange_stack_client,next"
"SUPER+SHIFT+p" = "exchange_stack_client,prev"

"SUPER+SHIFT+0" = "tag_special_silent"
"SUPER+SHIFT+1" = "tagsilent,1"
"SUPER+SHIFT+2" = "tagsilent,2"
"SUPER+SHIFT+3" = "tagsilent,3"
"SUPER+SHIFT+4" = "tagsilent,4"
"SUPER+SHIFT+5" = "tagsilent,5"
"SUPER+SHIFT+6" = "tagsilent,6"
"SUPER+SHIFT+7" = "tagsilent,7"
"SUPER+SHIFT+8" = "tagsilent,8"
"SUPER+SHIFT+9" = "tagsilent,9"

"SUPER+CTRL+SHIFT+h" = "tagmon,left"
"SUPER+CTRL+SHIFT+j" = "tagmon,down"
"SUPER+CTRL+SHIFT+k" = "tagmon,up"
"SUPER+CTRL+SHIFT+l" = "tagmon,right"

# movement
"SUPER+slash" = "togglejump"

"SUPER+h" = "focusdir,left"
"SUPER+j" = "focusdir,down"
"SUPER+k" = "focusdir,up"
"SUPER+l" = "focusdir,right"

"SUPER+n" = "focusstack,next"
"SUPER+p" = "focusstack,prev"

"SUPER+0" = "toggle_special_tag"
"SUPER+1" = "view,1"
"SUPER+2" = "view,2"
"SUPER+3" = "view,3"
"SUPER+4" = "view,4"
"SUPER+5" = "view,5"
"SUPER+6" = "view,6"
"SUPER+7" = "view,7"
"SUPER+8" = "view,8"
"SUPER+9" = "view,9"

"SUPER+CTRL+h" = "focusmon,left"
"SUPER+CTRL+j" = "focusmon,down"
"SUPER+CTRL+k" = "focusmon,up"
"SUPER+CTRL+l" = "focusmon,right"

# key modes
"SUPER+r" = "setkeymode,resize"

[bind.resize]
"h" = "resizewin,-10,+0"
"j" = "resizewin,+0,+10"
"k" = "resizewin,+0,-10"
"l" = "resizewin,+10,+0"
"SHIFT+h" = "movewin,-10,+0"
"SHIFT+j" = "movewin,+0,+10"
"SHIFT+k" = "movewin,+0,-10"
"SHIFT+l" = "movewin,+10,+0"
"Space" = "centerwin"
"Escape" = "setkeymode,default"

[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"SUPER+btn_right" = "moveresize,curresize"
